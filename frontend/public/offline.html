<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AirYatra</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #17111F 0%, #221A2D 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #F2EEF6;
      text-transform: uppercase;
    }
    h2 {
      font-size: 18px;
      font-weight: normal;
      color: #D0C9DA;
      margin-bottom: 30px;
    }
    p {
      color: #A197AE;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 50px;
      color: #fca5a5;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #C8F23C;
      color: #000000;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      transition: all 0.3s;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background: #B5DD2A;
      transform: translateY(-2px);
    }
    .features {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #3A3046;
    }
    .features h3 {
      color: #D0C9DA;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .feature-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .feature {
      padding: 8px 16px;
      background: rgba(148, 163, 184, 0.1);
      border-radius: 20px;
      font-size: 13px;
      color: #D0C9DA;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✈️</div>
    <h1>You're Offline</h1>
    <h2>आप ऑफलाइन हैं</h2>
    
    <div class="status">
      <span class="status-dot"></span>
      No internet connection
    </div>
    
    <p>
      Don't worry! Your data is safely stored. 
      Once you're back online, everything will sync automatically.
    </p>
    
    <button class="btn" onclick="window.location.reload()">
      Try Again
    </button>
    
    <div class="features">
      <h3>While offline, you can still:</h3>
      <div class="feature-list">
        <span class="feature">📋 View saved bookings</span>
        <span class="feature">📊 Access cached data</span>
        <span class="feature">📝 Draft new bookings</span>
      </div>
    </div>
  </div>

  <script>
    // Check if back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
