name: container-image

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/container-image.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/container-image.yml"]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and worker image (not pushed)
        run: docker build -t airyatra-api:${{ github.sha }} backend
      - name: Image runs as a non-root user
        run: test "$(docker image inspect -f '{{.Config.User}}' airyatra-api:${{ github.sha }})" = "10001:10001"
      - name: App imports inside the image
        run: >
          docker run --rm -e JWT_SECRET_KEY=ci-only -e APP_ENV=dev airyatra-api:${{ github.sha }}
          python -c "import server, worker; print('ok')"
      # Report-only until the dependency upgrade PR lands (pip-audit lists known CVEs in today's pins);
      # that PR switches exit-code to "1" so HIGH/CRITICAL findings with a fix block merges.
      - name: Trivy scan (report only for now)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: airyatra-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
