name: backend-ci

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        # emergentintegrations is not on public indexes; tests stub it until Phase 3b replaces it.
        run: |
          grep -v '^emergentintegrations' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/unit -q --cov=. --cov-report=term --cov-report=xml
      - name: Bandit (high severity fails the build)
        run: bandit -q -r . -x ./tests -lll -iii
      - name: pip-audit (report only)
        continue-on-error: true
        run: pip-audit -r /tmp/requirements-ci.txt
